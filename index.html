<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Remplit tout l'écran en rognant légèrement si le ratio diffère */
            display: block;
        }
    </style>
</head>
<body>
    <img src="https://gcdnb.pbrd.co/images/fkOwbKf7_NaD.webp" alt="Displayed Image">
</body>
</html>
